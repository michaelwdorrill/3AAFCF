<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trailer</title>
  <meta name="description" content="Watch the trailer." />

  <!-- Skyrim-like display font. Cinzel is the web-safe fallback; if you drop
       assets/Sovngarde.ttf into the repo the site will prefer that (see @font-face below). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* If you add assets/Sovngarde.ttf (the fan-made Skyrim UI font), it will be
       used automatically. Otherwise Cinzel from Google Fonts is used. */
    @font-face {
      font-family: "Sovngarde";
      src: url("assets/Sovngarde.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --skyrim-font: "Sovngarde", "Cinzel", "Trajan Pro", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #e8e6e0;
      overflow: hidden;
      font-family: var(--skyrim-font);
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #trailer {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* ---- Intro overlay: prompt the user to interact + turn up volume ---- */
    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      padding: 6vh 8vw;
      transition: opacity 0.8s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .volume-icon {
      font-size: clamp(3rem, 9vw, 6rem);
      line-height: 1;
      margin-bottom: 3vh;
      filter: drop-shadow(0 0 18px rgba(200, 200, 220, 0.25));
      animation: pulse 2.4s ease-in-out infinite;
    }

    .headline {
      font-family: var(--skyrim-font);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: clamp(1.6rem, 5.5vw, 3.4rem);
      color: #f2efe6;
      text-shadow: 0 0 24px rgba(180, 190, 210, 0.35);
      margin-bottom: 2.2vh;
    }

    .subline {
      font-family: var(--skyrim-font);
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: clamp(0.8rem, 2.6vw, 1.25rem);
      color: #b9b4a6;
      max-width: 34ch;
      line-height: 1.9;
    }

    .prompt {
      margin-top: 5vh;
      font-family: var(--skyrim-font);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: clamp(0.75rem, 2.2vw, 1rem);
      color: #8f8a7d;
      animation: fade 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50%      { transform: scale(1.08); opacity: 1; }
    }

    @keyframes fade {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 1; }
    }

    /* Shown if the browser blocks unmuted autoplay and we had to fall back
       to a muted play, so the viewer knows to tap for sound. */
    #unmute-banner {
      position: fixed;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 0.8em;
      padding: 0.9em 1.4em;
      border: 1px solid rgba(232, 230, 224, 0.35);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      font-family: var(--skyrim-font);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 2vw, 0.95rem);
      color: #f2efe6;
      cursor: pointer;
      z-index: 15;
      animation: fade 2.2s ease-in-out infinite;
    }

    #unmute-banner.show { display: flex; }

    /* Loading / redirect message shown after the trailer finishes */
    #outro {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      padding: 6vh 8vw;
    }

    #outro.show { display: flex; }

    /* Temporary on-screen diagnostics panel for debugging mobile playback.
       Remove once the mobile issue is confirmed fixed. */
    #debug {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: none;
      z-index: 30;
      background: rgba(20, 0, 0, 0.9);
      color: #ffb4b4;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 10px 12px;
      max-height: 40vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #debug.show { display: block; }

    #debug button {
      margin-top: 8px;
      font-family: var(--skyrim-font);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: #400;
      color: #fff;
      border: 1px solid #ffb4b4;
      padding: 6px 12px;
      cursor: pointer;
    }

    .outro-text {
      font-family: var(--skyrim-font);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: clamp(1rem, 3.4vw, 1.8rem);
      color: #d8d3c6;
      animation: fade 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="trailer" playsinline preload="auto">
      <!-- Place your video at assets/Trailer.mp4 -->
      <source src="assets/Trailer.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Intro overlay: the user must interact so the browser allows audio playback -->
  <div id="overlay" role="button" tabindex="0" aria-label="Begin the trailer">
    <div class="volume-icon" aria-hidden="true">🔊</div>
    <div class="headline">Turn Up Your Volume</div>
    <div class="subline">This trailer has sound. Make sure you can hear it.</div>
    <div class="prompt">Tap anywhere to begin</div>
  </div>

  <!-- Shown briefly after the video ends, before the redirect -->
  <div id="outro" aria-hidden="true">
    <div class="outro-text">Loading&hellip;</div>
  </div>

  <!-- Fallback prompt if the browser blocked unmuted autoplay -->
  <div id="unmute-banner" role="button" tabindex="0" aria-label="Tap to unmute">
    <span aria-hidden="true">🔇</span>
    <span>Tap to unmute</span>
  </div>

  <!-- Temporary diagnostics panel: shows what actually happened instead of
       silently redirecting, so we can see the real error on mobile.
       Remove once the mobile issue is confirmed fixed. -->
  <div id="debug"></div>

  <script>
    // The destination the viewer is sent to when the trailer finishes.
    // Placeholder for now — replace with the real event link when ready.
    var REDIRECT_URL = "https://partiful.com/e/E0pwSoAR6JneNK9NDCmf";

    var overlay       = document.getElementById("overlay");
    var outro         = document.getElementById("outro");
    var video         = document.getElementById("trailer");
    var unmuteBanner  = document.getElementById("unmute-banner");

    var debugPanel = document.getElementById("debug");

    var started    = false;
    var redirected = false;

    function goToEvent() {
      if (redirected) return;
      redirected = true;
      outro.classList.add("show");
      window.location.href = REDIRECT_URL;
    }

    // TEMPORARY: shows what actually went wrong instead of silently
    // redirecting, with a manual continue link and an 8s auto-continue
    // so the flow still resolves for real guests. Remove once the mobile
    // issue is confirmed fixed.
    function showDebugAndContinue(label, detail) {
      var lines = [
        "DEBUG (" + label + ")",
        "UA: " + navigator.userAgent,
        "readyState: " + video.readyState,
        "networkState: " + video.networkState,
        "currentSrc: " + video.currentSrc,
        detail
      ];
      debugPanel.textContent = lines.join("\n");
      debugPanel.classList.add("show");

      var btn = document.createElement("button");
      btn.textContent = "Continue to event";
      btn.addEventListener("click", goToEvent);
      debugPanel.appendChild(document.createElement("br"));
      debugPanel.appendChild(btn);

      window.setTimeout(goToEvent, 8000);
    }

    function unmute() {
      video.muted = false;
      video.volume = 1.0;
      unmuteBanner.classList.remove("show");
    }

    function startTrailer() {
      if (started) return;
      started = true;

      overlay.classList.add("hidden");

      // Ensure audio is on (we required a user gesture, so this is allowed
      // on most browsers).
      video.muted = false;
      video.volume = 1.0;

      var playPromise = video.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(function (err) {
          // Some mobile browsers still block unmuted autoplay even after a
          // gesture. Fall back to a muted play so the trailer still runs,
          // and prompt the viewer to tap for sound instead of bouncing
          // them straight to the redirect.
          video.muted = true;
          video.volume = 0;
          var mutedPlayPromise = video.play();
          if (mutedPlayPromise && typeof mutedPlayPromise.catch === "function") {
            mutedPlayPromise.catch(function (err2) {
              showDebugAndContinue(
                "muted play() rejected",
                "unmuted error: " + err + "\nmuted error: " + err2
              );
            });
          }
          unmuteBanner.classList.add("show");
        });
      }
    }

    // Start on any interaction with the intro overlay.
    overlay.addEventListener("click", startTrailer);
    overlay.addEventListener("touchstart", startTrailer, { passive: true });
    overlay.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        startTrailer();
      }
    });

    // Let the viewer tap the video itself, or the banner, to unmute.
    unmuteBanner.addEventListener("click", unmute);
    video.addEventListener("click", function () {
      if (started && video.muted) unmute();
    });

    // Send them to the event page 5 seconds before the trailer actually
    // ends, so the transition feels snappier. "ended" stays as a fallback
    // in case duration is ever unavailable.
    var EARLY_REDIRECT_SECONDS = 5;
    video.addEventListener("timeupdate", function () {
      if (!isFinite(video.duration)) return;
      var earlyMark = Math.max(0, video.duration - EARLY_REDIRECT_SECONDS);
      if (video.currentTime >= earlyMark) goToEvent();
    });
    video.addEventListener("ended", goToEvent);

    // Safety net: if the video errors out after starting, don't trap the
    // viewer on a black screen - but show what happened first.
    video.addEventListener("error", function () {
      if (!started) return;
      var mediaError = video.error;
      var detail = mediaError
        ? "MediaError code: " + mediaError.code + " (" + mediaError.message + ")"
        : "no MediaError object";
      showDebugAndContinue("video error event", detail);
    });
  </script>
</body>
</html>
