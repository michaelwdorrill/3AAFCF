<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trailer</title>
  <meta name="description" content="Watch the trailer." />

  <!-- Skyrim-like display font. Cinzel is the web-safe fallback; if you drop
       assets/Sovngarde.ttf into the repo the site will prefer that (see @font-face below). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* If you add assets/Sovngarde.ttf (the fan-made Skyrim UI font), it will be
       used automatically. Otherwise Cinzel from Google Fonts is used. */
    @font-face {
      font-family: "Sovngarde";
      src: url("assets/Sovngarde.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --skyrim-font: "Sovngarde", "Cinzel", "Trajan Pro", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #e8e6e0;
      overflow: hidden;
      font-family: var(--skyrim-font);
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #trailer {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* ---- Intro overlay: prompt the user to interact + turn up volume ---- */
    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      padding: 6vh 8vw;
      transition: opacity 0.8s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .volume-icon {
      font-size: clamp(3rem, 9vw, 6rem);
      line-height: 1;
      margin-bottom: 3vh;
      filter: drop-shadow(0 0 18px rgba(200, 200, 220, 0.25));
      animation: pulse 2.4s ease-in-out infinite;
    }

    .headline {
      font-family: var(--skyrim-font);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: clamp(1.6rem, 5.5vw, 3.4rem);
      color: #f2efe6;
      text-shadow: 0 0 24px rgba(180, 190, 210, 0.35);
      margin-bottom: 2.2vh;
    }

    .subline {
      font-family: var(--skyrim-font);
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: clamp(0.8rem, 2.6vw, 1.25rem);
      color: #b9b4a6;
      max-width: 34ch;
      line-height: 1.9;
    }

    .prompt {
      margin-top: 5vh;
      font-family: var(--skyrim-font);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: clamp(0.75rem, 2.2vw, 1rem);
      color: #8f8a7d;
      animation: fade 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50%      { transform: scale(1.08); opacity: 1; }
    }

    @keyframes fade {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 1; }
    }

    /* Loading / redirect message shown after the trailer finishes */
    #outro {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      padding: 6vh 8vw;
    }

    #outro.show { display: flex; }

    .outro-text {
      font-family: var(--skyrim-font);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: clamp(1rem, 3.4vw, 1.8rem);
      color: #d8d3c6;
      animation: fade 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="trailer" playsinline preload="auto">
      <!-- Place your video at assets/Trailer.mp4 -->
      <source src="assets/Trailer.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Intro overlay: the user must interact so the browser allows audio playback -->
  <div id="overlay" role="button" tabindex="0" aria-label="Begin the trailer">
    <div class="volume-icon" aria-hidden="true">🔊</div>
    <div class="headline">Turn Up Your Volume</div>
    <div class="subline">This trailer has sound. Make sure you can hear it.</div>
    <div class="prompt">Tap anywhere to begin</div>
  </div>

  <!-- Shown briefly after the video ends, before the redirect -->
  <div id="outro" aria-hidden="true">
    <div class="outro-text">Loading&hellip;</div>
  </div>

  <script>
    // The destination the viewer is sent to when the trailer finishes.
    // Placeholder for now — replace with the real event link when ready.
    var REDIRECT_URL = "https://partiful.com/e/cFadVDtIjiAh00iKc36j";

    var overlay = document.getElementById("overlay");
    var outro   = document.getElementById("outro");
    var video   = document.getElementById("trailer");

    var started  = false;
    var redirected = false;

    function goToEvent() {
      if (redirected) return;
      redirected = true;
      outro.classList.add("show");
      window.location.href = REDIRECT_URL;
    }

    function startTrailer() {
      if (started) return;
      started = true;

      overlay.classList.add("hidden");

      // Ensure audio is on (we required a user gesture, so this is allowed).
      video.muted = false;
      video.volume = 1.0;

      var playPromise = video.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(function () {
          // If playback is blocked for any reason, fall back to the redirect
          // so the viewer is never left staring at a black screen.
          goToEvent();
        });
      }
    }

    // Start on any interaction with the intro overlay.
    overlay.addEventListener("click", startTrailer);
    overlay.addEventListener("touchstart", startTrailer, { passive: true });
    overlay.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        startTrailer();
      }
    });

    // When the trailer finishes, send them to the event page.
    video.addEventListener("ended", goToEvent);

    // Safety net: if the video errors out, don't trap the viewer.
    video.addEventListener("error", function () {
      if (started) goToEvent();
    });
  </script>
</body>
</html>
